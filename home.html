<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kid's Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans flex flex-col min-h-screen transition-colors">
  <nav class="bg-white/90 dark:bg-gray-800/90 backdrop-blur shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-book-open text-indigo-600 text-2xl"></i>
          <span class="text-xl font-bold text-gray-900 dark:text-white">Kid's Book <span class="text-indigo-600">Explorer</span></span>
        </div>
        <div class="hidden md:flex items-center space-x-8">
          <a href="home.html" class="text-indigo-600 font-medium">Home</a>
          <a href="explore.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Explore</a>
          <a href="favorites.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Favorites</a>
          <a href="library.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Library</a>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 p-2 text-lg"></button>
          <button id="hamburger" class="md:hidden text-gray-600 dark:text-gray-300 p-2"><i class="fa-solid fa-bars text-xl"></i></button>
        </div>
      </div>
      <div id="mobile-menu" class="hidden md:hidden flex-col pb-4 space-y-2">
        <a href="home.html" class="block text-indigo-600 font-semibold">Home</a>
        <a href="explore.html" class="block text-gray-600 hover:text-indigo-600">Explore</a>
        <a href="favorites.html" class="block text-gray-600 hover:text-indigo-600">Favorites</a>
        <a href="library.html" class="block text-gray-600 hover:text-indigo-600">Library</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow">
    <section class="relative py-16 px-4 text-center overflow-hidden">
      <div style="position:absolute;inset:0;background-image:url('images/book.jpg');background-size:cover;background-position:center;z-index:0;"></div>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:1;"></div>
      <div class="relative z-10 text-white max-w-3xl mx-auto">
        <span class="bg-indigo-900/30 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full">Kids Stories</span>
        <h1 class="text-3xl sm:text-5xl font-extrabold mt-4 leading-tight">Your Gateway to Kids' Stories</h1>
        <p class="mt-4 text-white/90 max-w-xl mx-auto">Search thousands of books, save favorites, and track your reading journey.</p>
        <form id="search-form" class="mt-8 max-w-md mx-auto flex gap-2">
          <div class="relative flex-grow">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="search-input" type="text" placeholder="Search by title, author, or genre..."
              class="w-full pl-10 pr-4 py-3 rounded-lg text-gray-700 placeholder-gray-400 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-md">
          </div>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-lg font-medium shadow-md transition">Search</button>
        </form>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="flex justify-between items-center mb-8">
        <h2 id="grid-title" class="text-2xl font-bold text-gray-800 dark:text-white">Popular Books</h2>
        <a href="explore.html" class="text-sm text-indigo-600 hover:underline">View All</a>
      </div>
      <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <span class="text-white font-semibold"><i class="fa-solid fa-book-open text-indigo-400 mr-2"></i>Kid's Book Explorer</span>
      <p class="text-sm">&copy; 2026 Kid's Book Explorer. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/home.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

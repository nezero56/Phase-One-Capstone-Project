<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - Kid's Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans flex flex-col min-h-screen transition-colors">
  <nav class="bg-white/90 dark:bg-gray-800/90 backdrop-blur shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-book-open text-indigo-600 text-2xl"></i>
          <span class="text-xl font-bold text-gray-900 dark:text-white">Kid's Book <span class="text-indigo-600">Explorer</span></span>
        </div>
        <div class="hidden md:flex items-center space-x-8">
          <a href="home.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Home</a>
          <a href="explore.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Explore</a>
          <a href="favorites.html" class="text-indigo-600 font-medium">Favorites</a>
          <a href="library.html" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 transition">Library</a>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 p-2 text-lg"></button>
          <button id="hamburger" class="md:hidden text-gray-600 dark:text-gray-300 p-2"><i class="fa-solid fa-bars text-xl"></i></button>
        </div>
      </div>
      <div id="mobile-menu" class="hidden md:hidden flex-col pb-4 space-y-2">
        <a href="home.html" class="block text-gray-600 hover:text-indigo-600">Home</a>
        <a href="explore.html" class="block text-gray-600 hover:text-indigo-600">Explore</a>
        <a href="favorites.html" class="block text-indigo-600 font-semibold">Favorites</a>
        <a href="library.html" class="block text-gray-600 hover:text-indigo-600">Library</a>
      </div>
    </div>
  </nav>

  <header class="relative py-12 px-4 text-center overflow-hidden">
      <div style="position:absolute;inset:0;background-image:url('images/book.jpg');background-size:cover;background-position:center;z-index:0;"></div>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:1;"></div>
      <div class="relative z-10 text-white">
        <h1 class="text-3xl sm:text-5xl font-extrabold mt-4 leading-tight">My Favorite Books</h1>
        <p class="mt-4 text-white/90 max-w-xl mx-auto">Your curated library, saved in your browser.</p>
      </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12 dark:text-white">
    <div id="empty-state" class="hidden text-center py-16">
      <span class="text-6xl">⭐</span>
      <h2 class="text-2xl font-bold text-gray-700 mt-4 mb-2">No favorites yet</h2>
      <p class="text-gray-500 mb-6">Explore books and add them to your collection.</p>
      <a href="home.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-semibold shadow transition">Browse Books</a>
    </div>
    <div id="favorites-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t border-gray-800 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm">
      <p>&copy; 2026 Kid's Book Explorer. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
